[project]
name = "grounded-answers"
version = "0.1.0"
description = "A small RAG service that answers only from its documents and refuses otherwise, with verified citations."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Shivam Batra" }]
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.7",
    "uvicorn>=0.30",
]

[project.scripts]
grounded-answers-eval = "grounded_answers.evals:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grounded_answers"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "N", "PT"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # Starlette's TestClient warns about its own httpx backend. Not our code path.
    "ignore:Using `httpx` with `starlette.testclient`",
]
